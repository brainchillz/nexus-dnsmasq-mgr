<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNSMAQ-MGR</title>
<meta name="theme-color" content="#1c1e22">
<link rel="stylesheet" href="/static/css/style.css">
<script>try { if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('theme-light'); } catch (e) {}</script>
</head>
<body>
<div id="login-screen" style="display:none">
  <form class="login-box" onsubmit="doLogin(event)">
    <h1>DNSMAQ-MGR</h1>
    <p class="subtitle">dnsmasq management &middot; sign in to continue</p>
    <div class="form-group"><label>Username</label><input id="login-user" class="form-control" autocomplete="username"></div>
    <div class="form-group"><label>Password</label><input id="login-pass" type="password" class="form-control" autocomplete="current-password"></div>
    <div id="login-error" class="error" style="display:none"></div>
    <button class="btn" type="submit">Sign In</button>
  </form>
</div>
<nav class="sidebar">
  <div class="sidebar-header">
    <h1 id="sidebar-title">DNSMAQ-MGR</h1>
    <p class="subtitle">dnsmasq management</p>
  </div>
  <ul class="nav-list">
    <li><a href="#" data-page="overview" class="active"><span class="icon">&#9733;</span> Overview</a></li>
    <li><a href="#" data-page="dns"><span class="icon">&#127760;</span> DNS Overrides</a></li>
    <li><a href="#" data-page="dhcp"><span class="icon">&#128268;</span> DHCP</a></li>
    <li><a href="#" data-page="netboot"><span class="icon">&#128640;</span> Network Boot</a></li>
    <li><a href="#" data-page="stats"><span class="icon">&#128200;</span> Statistics</a></li>
    <li class="nav-admin-only"><a href="#" data-page="peers"><span class="icon">&#8646;</span> Mirroring</a></li>
    <li><a href="#" data-page="config"><span class="icon">&#128196;</span> Config</a></li>
    <li class="nav-admin-only"><a href="#" data-page="settings"><span class="icon">&#9881;</span> Settings</a></li>
  </ul>
  <div class="sidebar-footer">
    <div class="footer-account">
      <span id="account-user"></span>
      <a href="#" onclick="changePassword(event)">Password</a>
      <a href="#" onclick="doLogout(event)">Sign out</a>
      <a href="#" onclick="toggleTheme(event)"><span id="theme-label">Light theme</span></a>
    </div>
  </div>
</nav>
<main class="content">
  <div id="page-content"></div>
</main>

<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div class="modal" id="modal-content">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="/static/js/core.js"></script>
<script src="/static/js/dns.js"></script>
<script src="/static/js/dhcp.js"></script>
<script src="/static/js/netboot.js"></script>
<script src="/static/js/stats.js"></script>
<script src="/static/js/peers.js"></script>
<script src="/static/js/config.js"></script>
<script src="/static/js/settings.js"></script>
</body>
</html>
