<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNSMAQ-MGR</title>
<meta name="theme-color" content="#1c1e22">
<link rel="stylesheet" href="/static/css/style.css">
<script>try { if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('theme-light'); } catch (e) {}</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

  <symbol id="i-glb" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.72 0"/><line x1="12" y1="2" x2="12" y2="12"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></symbol>

  <symbol id="i-dl" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
</defs></svg>
<div id="login-screen" style="display:none">
  <form class="login-box" onsubmit="doLogin(event)">
    <div class="sidebar-mark" style="margin-bottom:12px"><svg class="ico"><use href="#i-glb"/></svg></div>
    <h1>DNSMAQ-MGR</h1>
    <p class="subtitle">dnsmasq management &middot; sign in to continue</p>
    <div class="form-group"><label>Username</label><input id="login-user" class="form-control" autocomplete="username"></div>
    <div class="form-group"><label>Password</label><input id="login-pass" type="password" class="form-control" autocomplete="current-password"></div>
    <div id="login-error" class="error" style="display:none"></div>
    <button class="btn" type="submit">Sign In</button>
  </form>
</div>
<nav class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-mark"><svg class="ico"><use href="#i-glb"/></svg></div>
    <div class="sidebar-brand">
      <h1 id="sidebar-title">DNSMAQ-MGR</h1>
      <p class="subtitle">dnsmasq management</p>
    </div>
  </div>
  <ul class="nav-list">
    <li><a href="#" data-page="overview" class="active"><svg class="ico"><use href="#i-grid"/></svg> Overview</a></li>
    <li><a href="#" data-page="dns"><svg class="ico"><use href="#i-glb"/></svg> DNS Overrides</a></li>
    <li><a href="#" data-page="dhcp"><svg class="ico"><use href="#i-swap"/></svg> DHCP</a></li>
    <li><a href="#" data-page="netboot"><svg class="ico"><use href="#i-power"/></svg> Network Boot</a></li>
    <li><a href="#" data-page="stats"><svg class="ico"><use href="#i-chart"/></svg> Statistics</a></li>
    <li class="nav-admin-only"><a href="#" data-page="peers"><svg class="ico"><use href="#i-repeat"/></svg> Mirroring</a></li>
    <li><a href="#" data-page="config"><svg class="ico"><use href="#i-file"/></svg> Config</a></li>
    <li class="nav-admin-only"><a href="#" data-page="settings"><svg class="ico"><use href="#i-sli"/></svg> Settings</a></li>
  </ul>
  <div class="sidebar-footer">
    <div class="footer-account">
      <span id="account-user"></span>
      <a href="#" onclick="changePassword(event)">Password</a>
      <a href="#" onclick="doLogout(event)">Sign out</a>
      <a href="#" onclick="toggleTheme(event)"><span id="theme-label">Light theme</span></a>
    </div>
  </div>
</nav>
<main class="content">
  <div id="page-content"></div>
</main>

<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div class="modal" id="modal-content">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="/static/js/core.js"></script>
<script src="/static/js/dns.js"></script>
